und:radial-gradient(circle at 55% 10%,#1f6094,transparent 40%),linear-gradient(145deg,#071427,#0c2d48)}.authbox{max-width:440px;width:100%;border-radius:26px;background:white;padding:32px;box-shadow:0 28px 100px #0005}.authlogo{text-align:center;margin-bottom:23px}.authlogo .brandmark{margin:0 auto 15px;width:65px;height:65px;font-size:35px}.authlogo h1{margin:0;font-size:30px}.authlogo p{color:var(--muted);font-size:13px}.authbox .btn{width:100%;padding:14px}.authswitch{text-align:center;margin:16px 0 0;font-size:13px}.textbutton{background:none;border:0;color:var(--blue);font-weight:800;padding:4px}.warning{background:#fff5df;border:1px solid #f6db9f;color:#805c13;border-radius:12px;padding:12px;font-size:12px;line-height:1.55}.mapcontainer{height:430px;border-radius:15px;overflow:hidden;position:relative;background:#dce7d7;border:1px solid #d9e2e8}.map{height:100%;width:100%;z-index:1}.mapfallback{position:absolute;inset:0;background:#c9e2d5;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px}.maplegend{display:flex;flex-wrap:wrap;gap:13px;margin:12px 0;font-size:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.mapbtns{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.contactline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.contactline:last-child{border-bottom:0}.contactline .avatar{background:#e2eefa;color:#2169aa}.contactline strong{font-size:14px}.contactline small{display:block;font-size:11px;color:var(--muted);margin-top:4px}.contactsactions{display:flex;gap:5px;flex-wrap:wrap}.chatbox{height:370px;overflow:auto;background:#f1f5fa;border-radius:15px;padding:17px;display:flex;flex-direction:column;gap:11px}.bubble{max-width:80%;background:white;padding:11px 13px;border-radius:14px 14px 14px 3px;font-size:13px;align-self:flex-start;box-shadow:0 2px 7px #1029430c;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#1767cc;color:white;border-radius:14px 14px 3px 14px}.bubble small{display:block;font-size:10px;margin-top:5px;opacity:.77;text-align:right}.quickmessages{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.quickmessages .btn{font-size:11px}.chatinput{display:flex;gap:8px}.chatinput input{flex:1;min-width:0;padding:12px;border:1px solid #d4e0eb;border-radius:11px}.empty{text-align:center;color:var(--muted);padding:36px 12px;font-size:13px}.listtable{display:grid;gap:11px}.notice{border-left:4px solid var(--yellow);padding:13px 15px;background:#fffaf0;border-radius:8px;font-size:13px;line-height:1.6}.switchrow{display:flex;gap:10px;align-items:center;font-size:13px}.switchrow input{width:17px;height:17px}.modalback{position:fixed;inset:0;z-index:1000;background:#071626aa;display:grid;place-items:center;padding:16px}.modal{background:white;border-radius:21px;padding:24px;max-width:460px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 100px #0006}.modal h2{margin:0 0 17px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:1100;background:#102d46;color:#fff;padding:12px 19px;border-radius:15px;box-shadow:var(--shadow);font-size:13px;max-width:90vw}.mobile-nav{display:none}.hidden{display:none!important}.tabbar{display:flex;gap:6px;background:#edf2f7;padding:5px;border-radius:12px;margin-bottom:15px}.tabbar button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font-weight:800;color:#64778d}.tabbar button.active{background:#fff;color:#1767cc;box-shadow:0 2px 7px #0e274016}.risklist{display:grid;gap:10px}.riskitem{display:flex;justify-content:space-between;align-items:center;gap:12px;border-radius:12px;background:#f6f8fb;padding:12px}.riskitem strong{font-size:13px}.riskitem p{margin:4px 0 0;font-size:11px;color:var(--muted)}.metricgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{padding:16px;background:#f3f7fb;border-radius:14px}.metric strong{display:block;font-size:23px;color:#1767cc}.metric span{font-size:11px;color:var(--muted)}@media(max-width:850px){.shell{display:block}.sidebar{display:none}.content{padding:20px 15px 98px}.topbar h1{font-size:23px}.grid2{grid-template-columns:1fr}.grid3{gap:8px}.quicktile{min-height:117px;padding:14px}.quicktile strong{font-size:12px}.tileico{font-size:24px}.panel{padding:17px}.mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:white;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:7px 3px max(7px,env(safe-area-inset-bottom));box-shadow:0 -3px 20px #0001}.mobile-nav button{background:none;border:0;display:grid;gap:3px;text-align:center;color:#63768b;font-size:10px;padding:6px}.mobile-nav button.active{color:var(--blue);font-weight:800}.mobile-nav .ico{font-size:21px}.mapcontainer{height:390px}.userchip span.username{display:none}.cardalert{padding:18px}.metricgrid{gap:7px}.metric{padding:10px}.metric strong{font-size:19px}}@media(max-width:370px){.contactline{align-items:flex-start;flex-direction:column}.contactsactions{align-self:flex-end}.topbar h1{font-size:20px}}

<body><div id="app"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjGwZrQipT8H6jRN9MhtA5x4RBa0w=" crossorigin=""></script>
<script>
/* ConectaSOS: DEMO EDUCATIVA. Datos y mensajes locales; NO es un servicio de emergencias. */
const STORE='conectasos_demo_v1';
const regions=[
{id:'valpo',name:'Valparaíso · zona costera',type:'Zona afectada',detail:'Simulación de terremoto 7,1',lat:-33.0458,lng:-71.6197,radius:1900,color:'#e04b58'},
{id:'vina',name:'Viña del Mar · sector centro',type:'Zona sin señal',detail:'Interrupción de comunicaciones',lat:-33.0245,lng:-71.5518,radius:1450,color:'#f1ac36'},
{id:'quilpue',name:'Quilpué · sector oriente',type:'Zona afectada',detail:'Simulación de afectación vial',lat:-33.0499,lng:-71.4424,radius:1700,color:'#e04b58'},
{id:'albergue',name:'Albergue',type:'Albergue habilitado',detail:'Punto de encuentro',lat:-33.033,lng:-71.506,color:'#27a97c'}
];
const seed={user:null,contacts:[{id:'c1',name:'Mamá',phone:'',status:'A salvo',allow:true,lat:-33.031,lng:-71.56},{id:'c2',name:'Papá',phone:'',status:'Sin señal',allow:true,lat:-33.056,lng:-71.52},{id:'c3',name:'Hermano',phone:'',status:'A salvo',allow:true,lat:-33.015,lng:-71.48}],messages:[],alerts:[{id:'a1',title:'Sismo de magnitud 7,1',region:'Región de Valparaíso',details:'Ejercicio ficticio: revisa el mapa y contacta a tu familia.',source:'Fuente simulada para evaluación de interfaz',time:'Hace 12 min',level:'Alta'},{id:'a2',title:'Corte de señal en zona costera',region:'Viña del Mar',details:'Ejemplo ficticio de interrupción de conectividad.',source:'Fuente simulada para evaluación de interfaz',time:'Hace 5 min',level:'Media'},{id:'a3',title:'Albergue habilitado',region:'Quilpué',details:'Punto ilustrativo: no corresponde a un albergue real.',source:'Fuente simulada para evaluación de interfaz',time:'Hace 25 min',level:'Informativa'}],myStatus:'Sin confirmar',demoStarted:Date.now()};
const deepCopy=o=>JSON.parse(JSON.stringify(o));let state;try{state=JSON.parse(localStorage.getItem(STORE))||deepCopy(seed)}catch{state=deepCopy(seed)};state.contacts??=[];state.messages??=[];state.alerts??=deepCopy(seed.alerts);state.theme=state.theme==='light'?'light':'dark';const defaultOrder=['mapa','familia','mensajes','alertas'];state.quickOrder=Array.isArray(state.quickOrder)&&state.quickOrder.length===4&&new Set(state.quickOrder).size===4&&defaultOrder.every(v=>state.quickOrder.includes(v))?state.quickOrder:defaultOrder.slice();
let page='inicio',authMode='register',map=null,mapLayer=null,mapMarkers=null,selectedContact='c1',familyTab='lista',toastTimer=null,filterRisks='all',showModal=false,editedContact=null,clockStart=null,taskErrors=0,taskCompletions=0;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem(STORE,JSON.stringify(state));
const uid=()=> 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hhmm=()=>new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
function toast(s){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),3000)}
function icon(t){return ({inicio:'⌂',mapa:'◫',familia:'♧',mensajes:'✉',alertas:'⚠',mas:'⚙'})[t]}
const navLabels={inicio:'Inicio',mapa:'Mapa',familia:'Familia',mensajes:'Mensajes',alertas:'Alertas',mas:'Más'};const navs=()=>[['inicio','Inicio'],...state.quickOrder.map(id=>[id,navLabels[id]]),['mas','Más']];
function navigate(to){page=to;map=null;render();window.scrollTo({top:0,behavior:'instant'})}
function shell(inner,title,subtitle){let name=state.user?.name||'Usuario';return `<div class="shell"><aside class="sidebar"><div class="brand"><div class="brandmark">✳</div><div><strong>Conecta<span style="display:inline;color:#61b6ff;font-size:22px;letter-spacing:-.04em">SOS</span></strong><span>SIEMPRE CONECTADOS</span></div></div><p class="side-note">Comunicación familiar en emergencias · Aplicación de práctica</p><nav class="navlinks">${navs().map(([id,label])=>`<button class="navlink ${page===id?'active':''}" data-go="${id}"><span class="ico">${icon(id)}</span>${label}</button>`).join('')}</nav><div class="side-bottom"><span class="badge demo">● MODO PRÁCTICA</span><p>Escenario de práctica. Sin alertas oficiales, conexión satelital ni envío de mensajes reales.</p></div></aside><main class="content"><header class="topbar"><div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div><div class="userchip"><span class="username">${esc(name.split(' ')[0])}</span><span class="avatar">${esc(name[0]?.toUpperCase()||'U')}</span></div></header>${inner}</main><nav class="mobile-nav">${navs().map(([id,label])=>`<button class="${page===id?'active':''}" data-go="${id}"><span class="ico">${icon(id)}</span>${label}</button>`).join('')}</nav></div>`}
function auth(){return `<div class="authback"><div class="authbox"><div class="authlogo"><div class="brandmark">✳</div><h1>Conecta<span style="color:#2479d3">SOS</span></h1><p>Siempre conectados, incluso cuando todo falla</p><span class="badge demo">VERSIÓN DE PRUEBA</span></div><h2 style="font-size:20px">${authMode==='register'?'Crear cuenta':'Iniciar sesión'}</h2><form id="authform">${authMode==='register'?'<div class="field"><label for="name">Nombre</label><input id="name" name="name" autocomplete="name" required maxlength="45" placeholder="Ej.: Camila Soto"></div>':''}<div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="ejemplo@correo.cl"></div><div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" minlength="4" required autocomplete="${authMode==='register'?'new-password':'current-password'}" placeholder="Mínimo 4 caracteres"></div><button class="btn" type="submit">${authMode==='register'?'Crear cuenta y continuar':'Entrar a mi cuenta'}</button></form><p class="authswitch">${authMode==='register'?'¿Ya tienes cuenta?':'¿Primera vez aquí?'} <button class="textbutton" id="switchAuth">${authMode==='register'?'Iniciar sesión':'Crear cuenta'}</button></p><div class="warning">🔒 Versión de prueba: los datos se guardan solo en este navegador. No uses contraseñas reales ni información personal sensible.</div></div></div>`}
function home(){return shell(`<div class="cardalert"><div><span class="badge" style="background:#ffffff30;color:white">⚠ ALERTA DE EMERGENCIA</span><h2>${esc(state.alerts[0].title)}</h2><p>${esc(state.alerts[0].region)} · ${esc(state.alerts[0].time)}</p><p style="margin-top:9px;font-size:11px">Escenario de práctica · No es una alerta oficial</p></div><button class="btn light small" data-go="mapa">Ver mapa</button></div><div class="between" style="margin-bottom:10px"><strong style="font-size:14px">Mis accesos rápidos</strong><button class="textbutton tiny" data-go="mas">⚙ Personalizar</button></div><div class="grid3" style="margin-bottom:20px">${state.quickOrder.map(id=>`<button class="quicktile" data-go="${id}"><span class="tileico">${({mapa:'🗺️',familia:'👨‍👩‍👧',mensajes:'➤',alertas:'⚠️'})[id]}</span><strong>${({mapa:'Mapa de emergencia',familia:'Mi familia',mensajes:'Enviar mensaje',alertas:'Alertas'})[id]}</strong></button>`).join('')}</div><div class="grid2"><section class="panel"><div class="between"><h2 class="title2">Últimas actualizaciones</h2><button class="textbutton tiny" data-go="alertas">Ver todas</button></div>${state.alerts.map(a=>`<div class="item row"><span style="font-size:20px">${a.level==='Alta'?'🔴':a.level==='Media'?'🟠':'🟢'}</span><div><strong style="font-size:13px">${esc(a.title)}</strong><div class="tiny muted">${esc(a.region)} · ${esc(a.time)}</div></div></div>`).join('')}</section><section class="panel"><h2 class="title2">Estado de conectividad</h2><p><span class="badge demo">◌ MODO PRÁCTICA</span></p><p class="muted tiny" style="line-height:1.7">No existe conexión satelital. Los mensajes y la confirmación de seguridad se simulan en este dispositivo.</p><div class="between" style="margin:23px 0 8px"><strong style="font-size:13px">Mi estado</strong><span class="badge ${state.myStatus==='A salvo'?'good':state.myStatus==='Necesito ayuda'?'danger':'blue'}">${esc(state.myStatus)}</span></div><div class="quickmessages"><button class="btn small" data-my-status="A salvo">✓ Estoy a salvo</button><button class="btn small danger" data-my-status="Necesito ayuda">✋ Necesito ayuda</button></div></section></div>`, `Hola, ${esc((state.user?.name||'Camila').split(' ')[0])} 👋`,'Tu centro de información y contacto familiar')}
function mapScreen(){return shell(`<div class="panel"><div class="between" style="align-items:flex-start;flex-wrap:wrap"><div><h2 class="title2" style="margin-bottom:7px">Mapa de zonas de riesgo</h2><p class="muted tiny" style="margin-top:0">Valparaíso, Viña del Mar y Quilpué</p></div><span class="badge demo">MAPA INTERACTIVO</span></div><div class="mapbtns"><button class="btn ${filterRisks==='all'?'':'secondary'} small" data-risk="all">Todas las zonas</button><button class="btn ${filterRisks==='risk'?'':'secondary'} small" data-risk="risk">🔴 Afectadas</button><button class="btn ${filterRisks==='signal'?'':'secondary'} small" data-risk="signal">🟠 Sin señal</button><button class="btn ${filterRisks==='shelter'?'':'secondary'} small" data-risk="shelter">🟢 Albergue</button><button class="btn secondary small" id="myLocation">◎ Mi ubicación</button><a class="btn secondary small" href="https://www.google.com/maps/@-33.043,-71.538,12z" target="_blank" rel="noopener noreferrer" style="text-decoration:none">↗ Abrir Google Maps</a></div><div class="mapcontainer"><div id="map" class="map"></div><div id="mapfallback" class="mapfallback"><div style="font-size:40px">🗺️</div><strong>Se necesita internet para cargar el mapa real.</strong><p class="tiny">Puedes consultar las zonas en la lista inferior.</p></div></div><div class="maplegend"><span><i class="dot" style="background:#e04b58"></i>Zona afectada</span><span><i class="dot" style="background:#f1ac36"></i>Zona sin señal</span><span><i class="dot" style="background:#27a97c"></i>Albergue</span><span><i class="dot" style="background:#2687e4"></i>Tu ubicación (opcional)</span></div><p class="notice">⚠ Las zonas de riesgo y puntos de refugio son escenarios de práctica. <strong>NO usar para tomar decisiones en una emergencia real.</strong> El mapa base requiere internet.</p></div><div class="panel" style="margin-top:16px"><h2 class="title2">Detalle de áreas</h2><div class="risklist">${regions.filter(r=>filterRisks==='all'||(filterRisks==='risk'&&r.type==='Zona afectada')||(filterRisks==='signal'&&r.type==='Zona sin señal')||(filterRisks==='shelter'&&r.type==='Albergue habilitado')).map(r=>`<div class="riskitem"><div><strong>${esc(r.name)}</strong><p>${esc(r.type)} · ${esc(r.detail)}</p></div><button class="btn small secondary" data-center="${r.id}">Ver</button></div>`).join('')}</div></div>`, 'Mapa de emergencia','Consulta áreas y señales representadas para la demostración')}
function family(){return shell(`<div class="panel"><div class="between" style="margin-bottom:15px"><div><h2 class="title2" style="margin:0">Mi grupo familiar (${state.contacts.length})</h2><p class="tiny muted" style="margin:6px 0">Vincula contactos antes de una emergencia</p></div><button class="btn small" id="addContact">＋ Agregar</button></div><div class="tabbar"><button data-family-tab="lista" class="${familyTab==='lista'?'active':''}">Lista</button><button data-family-tab="ubicacion" class="${familyTab==='ubicacion'?'active':''}">Ubicación</button></div>${familyTab==='lista'?(state.contacts.length?state.contacts.map(c=>`<div class="contactline"><div class="row"><span class="avatar">${esc(c.name[0]?.toUpperCase())}</span><div><strong>${esc(c.name)}</strong><small>${esc(c.status)} · ${c.allow?'Compartición permitida':'Sin permiso para compartir'}</small></div></div><div class="contactsactions"><button class="btn small secondary" data-chat="${c.id}">✉ Mensaje</button><button class="btn small outline" data-edit="${c.id}">Editar</button><button class="btn small danger" data-delete="${c.id}">✕</button></div></div>`).join(''):'<div class="empty">Aún no tienes familiares. Agrega tu primer contacto.</div>'):`<div class="mapcontainer" style="height:350px"><div id="map" class="map"></div><div id="mapfallback" class="mapfallback">Mapa no disponible sin conexión</div></div><p class="tiny muted">Las ubicaciones familiares se muestran para practicar la interfaz; no existe seguimiento de personas.</p>`}</div><div class="panel" style="margin-top:15px"><h2 class="title2">¿Cómo funciona la vinculación?</h2><p class="tiny muted" style="line-height:1.8">Puedes agregar un nombre, teléfono opcional y permiso para compartir ubicación. El vínculo es local: no se invita a la persona ni se accede a su ubicación real.</p></div>`, 'Mi familia','Contactos y permisos vinculados')}
function messages(){if(!state.contacts.some(x=>x.id===selectedContact))selectedContact=state.contacts[0]?.id;let c=state.contacts.find(x=>x.id===selectedContact);let msgs=state.messages.filter(m=>m.contactId===selectedContact);return shell(`<div class="grid2" style="grid-template-columns:minmax(0,1fr) 245px"><section class="panel"><h2 class="title2">Conversación ${c?'con '+esc(c.name):''}</h2>${state.contacts.length?`<div class="field"><label for="chatSelect">Elegir familiar</label><select id="chatSelect">${state.contacts.map(x=>`<option value="${x.id}" ${x.id===selectedContact?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="chatbox" id="chatbox">${msgs.length?msgs.map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.text)}<small>${esc(m.time)} · ${m.mine?esc(m.status):'Recibido'}</small></div>`).join(''):'<div class="empty">Todavía no hay mensajes.<br>Prueba las respuestas rápidas.</div>'}</div><div class="quickmessages"><button class="btn small" data-quick="Estoy a salvo">✓ Estoy a salvo</button><button class="btn small danger" data-quick="Necesito ayuda">✋ Necesito ayuda</button><button class="btn small" style="background:#e9b846;color:#403006" data-quick="Voy en camino">➜ Voy en camino</button></div><form id="messageform" class="chatinput"><input id="messageText" maxlength="120" required placeholder="Mensaje corto (máx. 120 caracteres)" aria-label="Mensaje corto"><button class="btn" type="submit">➤ Enviar</button></form><p class="tiny muted">Envío, entrega, lectura y respuesta son simulaciones locales.</p>`:'<div class="empty">Agrega un familiar para comenzar.</div><button class="btn" data-go="familia">Agregar familiar</button>'}</section><section class="panel"><h2 class="title2">Estados del mensaje</h2><div class="stack tiny"><div>◷ <strong>Enviado:</strong> aparece al presionar Enviar</div><div>✓ <strong>Entregado:</strong> llega al contacto</div><div>✓✓ <strong>Leído:</strong> contacto lo abre</div><div>🟢 <strong>Confirmación:</strong> respuesta de seguridad</div></div><div class="warning" style="margin-top:22px">La aplicación no envía mensajes a otros teléfonos. Está diseñada para probar la comprensión de la interfaz con usuarios.</div></section></div>`,'Mensajes','Envía avisos breves y prueba confirmaciones de seguridad')}
function alerts(){return shell(`<section class="panel"><div class="between" style="margin-bottom:12px"><h2 class="title2">Centro de alertas</h2><span class="badge demo">ESCENARIO DE PRÁCTICA</span></div>${state.alerts.map((a,i)=>`<article class="item"><div class="between"><div><span class="badge ${a.level==='Alta'?'danger':a.level==='Media'?'demo':'good'}">${esc(a.level)}</span><h3 style="font-size:15px;margin:9px 0 4px">${esc(a.title)}</h3><p class="muted tiny" style="margin:0">${esc(a.region)} · ${esc(a.time)}</p></div><span style="font-size:25px">${i===0?'🔴':i===1?'🟠':'🟢'}</span></div><p class="tiny" style="line-height:1.6">${esc(a.details)}</p><p class="tiny muted">Fuente: ${esc(a.source)}</p><button class="btn secondary small" data-go="mapa">Ver zona en mapa</button></article>`).join('')}</section><div class="panel" style="margin-top:16px"><h2 class="title2">Prueba de confianza</h2><p class="muted tiny">La presentación propone comprobar si las personas confían más en una alerta que indica su fuente. Comparar las dos tarjetas:</p><div class="grid2"><div class="notice"><strong>Alerta A</strong><p>Riesgo en el sector centro</p><small>Fuente no indicada</small></div><div class="notice"><strong>Alerta B</strong><p>Riesgo en el sector centro</p><small>Fuente de práctica: organismo oficial (referencia ilustrativa)</small></div></div></div>`,'Alertas','Información de alertas para el escenario de práctica')}
function more(){let elapsed=clockStart?Math.round((Date.now()-clockStart)/1000):null;return shell(`<div class="grid2"><section class="panel"><h2 class="title2">Perfil</h2><div class="item"><strong class="tiny">Nombre</strong><p class="muted tiny">${esc(state.user?.name)}</p></div><div class="item"><strong class="tiny">Correo</strong><p class="muted tiny">${esc(state.user?.email)}</p></div><div class="item"><strong class="tiny">Mi estado</strong><p><span class="badge blue">${esc(state.myStatus)}</span></p></div><button class="btn outline small" id="logout">Cerrar sesión</button></section><section class="panel"><h2 class="title2">Pruebas con usuarios</h2><p class="tiny muted">Cronometra el recorrido desde que la persona comienza hasta que logra completar tareas.</p><div class="metricgrid"><div class="metric"><strong id="secs">${elapsed??'—'}</strong><span>Segundos</span></div><div class="metric"><strong>${taskCompletions}</strong><span>Tareas realizadas</span></div><div class="metric"><strong>${taskErrors}</strong><span>Errores anotados</span></div></div><div class="quickmessages"><button class="btn small" id="timerStart">▶ Iniciar prueba</button><button class="btn small secondary" id="markTask">✓ Tarea completada</button><button class="btn small danger" id="markError">＋ Error</button><button class="btn small outline" id="resetTimer">↺ Reiniciar</button></div><p class="tiny muted">Prueba: vincular contacto, leer alerta, encontrar zona, enviar “Estoy a salvo” e identificar “Entregado”.</p></section></div><div class="panel" style="margin-top:16px"><h2 class="title2">🎨 Apariencia y comodidad</h2><p class="tiny muted">Elige el aspecto de ConectaSOS y acomoda el menú a tu gusto. Se guardará en este dispositivo.</p><h3 style="font-size:14px">Tema de colores</h3><div class="theme-select"><button class="btn small ${state.theme==='dark'?'':'outline'}" data-theme="dark" aria-pressed="${state.theme==='dark'}">🌙 Azul oscuro</button><button class="btn small ${state.theme==='light'?'':'outline'}" data-theme="light" aria-pressed="${state.theme==='light'}">☀️ Blanco claro</button></div><h3 style="font-size:14px;margin-top:22px">Orden de opciones</h3><p class="tiny muted">Usa las flechas para ordenar los accesos de inicio y el menú. Inicio y Más permanecen fijos.</p>${state.quickOrder.map((id,i)=>`<div class="pref-row"><strong style="font-size:13px">${icon(id)} ${navLabels[id]}</strong><div class="pref-controls"><button class="btn outline small" data-move="${id}:-1" ${i===0?'disabled':''} aria-label="Subir ${navLabels[id]}">↑</button><button class="btn outline small" data-move="${id}:1" ${i===state.quickOrder.length-1?'disabled':''} aria-label="Bajar ${navLabels[id]}">↓</button></div></div>`).join('')}<div style="margin-top:12px"><button class="btn outline small" id="resetPrefs">Restablecer diseño original</button></div></div><div class="panel" style="margin-top:16px"><h2 class="title2">Información importante</h2><div class="warning"><strong>Aplicación universitaria experimental.</strong> Este prototipo no dispone de satélites, mensajería real, monitoreo de emergencias ni alertas oficiales. No funciona como servicio de auxilio. En una emergencia real, utiliza los canales de emergencia establecidos en tu localidad.</div><div class="quickmessages"><button class="btn secondary small" id="resetDemo">↺ Restablecer demostración</button></div></div>`,'Más opciones','Configuración y validación del prototipo')}
function modal(){return `<div class="modalback" id="modalback"><div class="modal" role="dialog" aria-modal="true" aria-label="Contacto"><div class="between"><h2>${editedContact?'Editar contacto':'Agregar contacto'}</h2><button class="btn small outline" id="closeModal">✕</button></div><form id="contactform"><div class="field"><label for="contactName">Nombre o relación *</label><input id="contactName" maxlength="45" required value="${esc(editedContact?.name||'')}" placeholder="Ej.: Abuela"></div><div class="field"><label for="contactPhone">Número de teléfono (opcional)</label><input id="contactPhone" type="tel" maxlength="22" value="${esc(editedContact?.phone||'')}" placeholder="Ej.: +56 9 1234 5678"></div><div class="field"><label for="contactStatus">Estado de ejemplo</label><select id="contactStatus">${['Sin confirmar','A salvo','Sin señal','Necesito ayuda','En camino'].map(s=>`<option ${editedContact?.status===s?'selected':''}>${s}</option>`).join('')}</select></div><label class="switchrow"><input type="checkbox" id="contactAllow" ${editedContact?.allow===false?'':'checked'}> Compartir ubicación en la simulación</label><p class="tiny muted">Este permiso es demostrativo. No registra ubicación real del contacto ni envía invitaciones.</p><div class="row" style="justify-content:flex-end;margin-top:20px"><button class="btn outline" type="button" id="cancelContact">Cancelar</button><button class="btn" type="submit">Guardar contacto</button></div></form></div></div>`}
function render(){document.body.classList.toggle('theme-light',state.theme==='light');document.body.classList.toggle('theme-dark',state.theme==='dark');document.querySelector('meta[name="theme-color"]')?.setAttribute('content',state.theme==='light'?'#ffffff':'#081a2e');document.getElementById('app').innerHTML=!state.user?auth():({inicio:home,mapa:mapScreen,familia:family,mensajes:messages,alertas:alerts,mas:more}[page]());if(showModal)document.getElementById('app').insertAdjacentHTML('beforeend',modal());bind();if(state.user && (page==='mapa'||(page==='familia'&&familyTab==='ubicacion')))setTimeout(initMap,60);if(page==='mensajes')setTimeout(()=>{let el=document.getElementById('chatbox');if(el)el.scrollTop=el.scrollHeight},40)}
function bind(){document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{state.theme=b.dataset.theme;save();render();toast('Apariencia actualizada')}));document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>{const [id,dir]=b.dataset.move.split(':');const i=state.quickOrder.indexOf(id),j=i+Number(dir);if(i>=0&&j>=0&&j<state.quickOrder.length){[state.quickOrder[i],state.quickOrder[j]]=[state.quickOrder[j],state.quickOrder[i]];save();render();}}));document.getElementById('resetPrefs')?.addEventListener('click',()=>{state.theme='dark';state.quickOrder=defaultOrder.slice();save();render();toast('Diseño original restablecido')});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go));let f=document.getElementById('authform');if(f)f.onsubmit=e=>{e.preventDefault();let data=new FormData(f),email=String(data.get('email')).trim().toLowerCase(),pw=String(data.get('password'));if(authMode==='register'){if(!data.get('name')?.trim())return toast('Ingresa tu nombre');state.user={name:String(data.get('name')).trim(),email,password:pw};state.account={...state.user};save();navigate('inicio');toast('Cuenta de demostración creada')}else if((state.account||state.user)?.email===email&&(state.account||state.user)?.password===pw){state.user={...(state.account||state.user)};save();navigate('inicio');toast('Sesión iniciada')}else toast('Correo o contraseña no coinciden en este navegador')};document.getElementById('switchAuth')?.addEventListener('click',()=>{authMode=authMode==='register'?'login':'register';render()});document.querySelectorAll('[data-my-status]').forEach(b=>b.onclick=()=>{state.myStatus=b.dataset.myStatus;save();render();toast('Tu estado se actualizó en este dispositivo')});document.querySelectorAll('[data-risk]').forEach(b=>b.onclick=()=>{filterRisks=b.dataset.risk;render()});document.querySelectorAll('[data-center]').forEach(b=>b.onclick=()=>{if(map){let r=regions.find(x=>x.id===b.dataset.center);map.setView([r.lat,r.lng],13)}else toast('Mapa no disponible sin conexión')});document.getElementById('myLocation')?.addEventListener('click',locate);document.getElementById('addContact')?.addEventListener('click',()=>{editedContact=null;showModal=true;render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editedContact=state.contacts.find(c=>c.id===b.dataset.edit);showModal=true;render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let c=state.contacts.find(x=>x.id===b.dataset.delete);if(confirm('¿Eliminar a '+c.name+' de la lista?')){state.contacts=state.contacts.filter(x=>x.id!==c.id);state.messages=state.messages.filter(x=>x.contactId!==c.id);save();render();toast('Contacto eliminado')}});document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{selectedContact=b.dataset.chat;navigate('mensajes')});document.querySelectorAll('[data-family-tab]').forEach(b=>b.onclick=()=>{familyTab=b.dataset.familyTab;render()});document.getElementById('closeModal')?.addEventListener('click',closeModal);document.getElementById('cancelContact')?.addEventListener('click',closeModal);document.getElementById('modalback')?.addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});document.getElementById('contactform')?.addEventListener('submit',saveContact);document.getElementById('chatSelect')?.addEventListener('change',e=>{selectedContact=e.target.value;render()});document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>sendMessage(b.dataset.quick));document.getElementById('messageform')?.addEventListener('submit',e=>{e.preventDefault();let input=document.getElementById('messageText');sendMessage(input.value);input.value=''});document.getElementById('logout')?.addEventListener('click',()=>{state.user=null;save();authMode='login';render()});document.getElementById('resetDemo')?.addEventListener('click',()=>{if(confirm('¿Restablecer contactos, mensajes y alertas de ejemplo? Se conservará tu cuenta.')){let u=state.user,a=state.account;state=deepCopy(seed);state.user=u;state.account=a;save();selectedContact='c1';navigate('inicio');toast('Datos de demostración restablecidos')}});document.getElementById('timerStart')?.addEventListener('click',()=>{clockStart=Date.now();taskErrors=0;taskCompletions=0;render();toast('Prueba iniciada')});document.getElementById('markTask')?.addEventListener('click',()=>{taskCompletions++;render()});document.getElementById('markError')?.addEventListener('click',()=>{taskErrors++;render()});document.getElementById('resetTimer')?.addEventListener('click',()=>{clockStart=null;taskErrors=0;taskCompletions=0;render()})}
function closeModal(){showModal=false;editedContact=null;render()}
function saveContact(e){e.preventDefault();let name=document.getElementById('contactName').value.trim();if(!name)return toast('Ingresa un nombre');let entry={id:editedContact?.id||uid(),name,phone:document.getElementById('contactPhone').value.trim(),status:document.getElementById('contactStatus').value,allow:document.getElementById('contactAllow').checked,lat:editedContact?.lat||(-33.05+(Math.random()-.5)*.07),lng:editedContact?.lng||(-71.53+(Math.random()-.5)*.10)};if(editedContact){state.contacts=state.contacts.map(c=>c.id===editedContact.id?entry:c)}else state.contacts.push(entry);save();closeModal();toast('Contacto guardado (solo en este dispositivo)')}
function sendMessage(value){let text=String(value||'').trim().slice(0,120);if(!text||!selectedContact)return;let id=uid(),c=selectedContact;state.messages.push({id,contactId:c,text,time:hhmm(),mine:true,status:'Enviado'});save();render();toast('Mensaje registrado');setTimeout(()=>updateMsg(id,'Entregado'),900);setTimeout(()=>updateMsg(id,'Leído'),2100);setTimeout(()=>{let contact=state.contacts.find(x=>x.id===c);if(!contact)return;let response=text.toLowerCase().includes('ayuda')?'Recibí tu aviso. Voy a intentar ayudarte.':'Recibido, estoy bien. Gracias por avisar.';state.messages.push({id:uid(),contactId:c,text:response,time:hhmm(),mine:false,status:'Recibido'});if(text.toLowerCase().includes('a salvo')){contact.status='A salvo'}save();if(page==='mensajes'&&selectedContact===c)render();toast('Respuesta de práctica de '+contact.name)},3600)}
function updateMsg(id,status){let m=state.messages.find(m=>m.id===id);if(m){m.status=status;save();if(page==='mensajes')render()}}
function mapFallback(){let m=document.getElementById('mapfallback');if(m)m.style.display='flex'}
function initMap(){let el=document.getElementById('map');if(!el)return;if(typeof L==='undefined'){mapFallback();return}try{map=L.map(el,{zoomControl:true}).setView([-33.043,-71.538],11);let tiles=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(map);tiles.on('tileerror',()=>mapFallback());let filtered=regions.filter(r=>filterRisks==='all'||(filterRisks==='risk'&&r.type==='Zona afectada')||(filterRisks==='signal'&&r.type==='Zona sin señal')||(filterRisks==='shelter'&&r.type==='Albergue habilitado'));filtered.forEach(r=>{let layer=r.radius?L.circle([r.lat,r.lng],{color:r.color,fillColor:r.color,fillOpacity:.26,radius:r.radius,weight:2}):L.circleMarker([r.lat,r.lng],{radius:12,color:'#fff',weight:3,fillColor:r.color,fillOpacity:1});layer.addTo(map).bindPopup(`<strong>${esc(r.name)}</strong><br>${esc(r.type)}<br>${esc(r.detail)}<br><em>Escenario de práctica</em>`)});if(page==='familia'){state.contacts.filter(c=>c.allow).forEach(c=>L.marker([c.lat,c.lng]).addTo(map).bindPopup(`<strong>${esc(c.name)}</strong><br>${esc(c.status)}<br>Ubicación de práctica`))}setTimeout(()=>map?.invalidateSize(),150)}catch(err){console.warn('Mapa sin conexión:',err);mapFallback()}}
function locate(){if(!navigator.geolocation)return toast('Geolocalización no disponible');toast('Solicitando permiso de ubicación');navigator.geolocation.getCurrentPosition(p=>{if(!map)return;let lat=p.coords.latitude,lng=p.coords.longitude;map.setView([lat,lng],13);L.circleMarker([lat,lng],{radius:9,color:'#fff',weight:3,fillColor:'#2687e4',fillOpacity:1}).addTo(map).bindPopup('Tu ubicación aproximada').openPopup()},()=>toast('No fue posible obtener la ubicación. Puedes usar el mapa sin ella.'),{enableHighAccuracy:false,timeout:8000})}
if ('serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn)); }
setInterval(()=>{let e=document.getElementById('secs');if(e&&clockStart)e.textContent=Math.round((Date.now()-clockStart)/1000)},1000);
render();
</script></body></html>
